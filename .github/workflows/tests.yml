name: tests

on:
  pull_request:
  push:
    branches: [main]

# Her job yalnızca ilgili klasör değiştiğinde çalışır; workflow dosyası değişirse
# hepsi çalışır. Atlanan job GitHub'da "skipped" görünür ve başarılı sayılır, bu
# yüzden workflow seviyesinde `paths:` yerine job seviyesinde `if:` kullanılıyor
# (aksi halde required check'ler "pending"de takılı kalır).
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      crawler: ${{ steps.filter.outputs.crawler }}
      database: ${{ steps.filter.outputs.database }}
      functions: ${{ steps.filter.outputs.functions }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/tests.yml
            crawler:
              - *workflow
              - crawler/**
            database:
              - *workflow
              - supabase/migrations/**
              - supabase/tests/**
              - supabase/seed.sql
              - supabase/config.toml
            functions:
              - *workflow
              - supabase/functions/**
            app:
              - *workflow
              - app/**

  crawler:
    needs: changes
    if: needs.changes.outputs.crawler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt pytest
      - run: python -m pytest crawler -q

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start # migration'lar + seed.sql
      - run: supabase test db # supabase/tests/database/*.sql (pgTAP)

  functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/nl-search/index.ts
      - run: deno test supabase/functions

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0" # app/README.md
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

# Supabase lokal geliştirme ayarları. `supabase start` bu dosyayı okur.
# Tüm anahtarlar: https://supabase.com/docs/guides/local-development/cli/config

project_id = "event-map"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "com.eventmap.app://login-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Google OAuth: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET değerlerini .env'e ekleyin.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "per_worker"
